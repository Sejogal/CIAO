[project]
name = "ciao"
version = "0.1.0"
description = "Open IoT Platform"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "redis>=6.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-jose[cryptography]>=3.5",
    "pwdlib[argon2]>=0.3.0",
    "email-validator",
    "python-dotenv>=1.1",
    "structlog>=25.4",
    "orjson>=3.11",
    "httpx>=0.28",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
]
