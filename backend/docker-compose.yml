version: "3.9"

services:

  api:
    build: .
    container_name: conecta-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis
      - emqx

  postgres:

    image: postgres:17

    container_name: conecta-postgres

    restart: always

    environment:

      POSTGRES_DB: conecta

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    ports:

      - "5432:5432"

  redis:

    image: redis:8

    container_name: conecta-redis

    ports:

      - "6379:6379"

  emqx:

    image: emqx/emqx:5

    container_name: conecta-emqx

    ports:

      - "1883:1883"

      - "18083:18083"

  pgadmin:

    image: dpage/pgadmin4

    container_name: conecta-pgadmin

    environment:

      PGADMIN_DEFAULT_EMAIL: admin@conecta.com

      PGADMIN_DEFAULT_PASSWORD: admin

    ports:

      - "5050:80"